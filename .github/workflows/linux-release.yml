name: Linux Desktop Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/tool-calling-agent

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ninja-build libgtk-3-dev cmake pkg-config \
            clang libblkid-dev liblzma-dev libsecret-1-dev \
            libjsoncpp-dev libglib2.0-dev

      - name: Override Firebase with Linux stubs
        run: |
          cat > pubspec_overrides.yaml << 'EOF'
          dependency_overrides:
            firebase_core:
              path: linux_stubs/firebase_core
            firebase_crashlytics:
              path: linux_stubs/firebase_crashlytics
            llama_flutter_android:
              path: local_plugins/llama_flutter_android
          EOF

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos || true

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package artifact
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../privatelm-linux-x64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: privatelm-linux-x64
          path: privatelm-linux-x64.tar.gz
